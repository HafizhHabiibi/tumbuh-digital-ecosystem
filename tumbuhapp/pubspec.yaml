name: tumbuhapp
description: Aplikasi monitoring tumbuh kembang anak untuk orang tua - Posyandu Digital
publish_to: "none"
version: 1.0.0+1

environment:
    sdk: ">=3.0.0 <4.0.0"

dependencies:
    flutter:
        sdk: flutter

    # State Management
    flutter_riverpod: ^2.6.1
    riverpod_annotation: ^2.3.5

    # HTTP Client
    dio: ^5.7.0

    # Penyimpanan Token (aman)
    flutter_secure_storage: ^9.2.2

    # Penyimpanan Preferensi
    shared_preferences: ^2.3.2

    # Navigasi
    go_router: ^14.3.0

    # Grafik Pertumbuhan
    fl_chart: ^0.69.0

    # Loading Shimmer
    shimmer: ^3.0.0

    # Firebase
    firebase_core: ^3.6.0
    firebase_messaging: ^15.1.3
    flutter_local_notifications: ^17.2.2

    # Format Tanggal & Angka
    intl: ^0.19.0

    # Model & JSON
    freezed_annotation: ^2.4.4
    json_annotation: ^4.9.0

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^4.0.0

    # Code Generator
    build_runner: ^2.4.12
    riverpod_generator: ^2.4.3
    freezed: ^2.5.7
    json_serializable: ^6.8.0

flutter:
    uses-material-design: true
